
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Create Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 12% 18%, rgba(167, 139, 250, .65), transparent 28%),
                radial-gradient(circle at 88% 82%, rgba(129, 140, 248, .55), transparent 30%),
                linear-gradient(135deg, #21145f 0%, #4338ca 48%, #7c3aed 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 16px;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 50%;
            pointer-events: none;
        }

        body::before {
            width: 420px;
            height: 420px;
            top: -180px;
            right: -100px;
        }

        body::after {
            width: 300px;
            height: 300px;
            bottom: -150px;
            left: -90px;
        }

        .auth-card {
            width: 100%;
            max-width: 490px;
            background: rgba(255, 255, 255, .97);
            border: 1px solid rgba(255, 255, 255, .55);
            border-radius: 24px;
            padding: 38px 42px;
            box-shadow: 0 28px 80px rgba(18, 12, 66, .35);
            position: relative;
            z-index: 1;
        }

        .brand {
            text-align: center;
            margin-bottom: 27px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: linear-gradient(135deg, #4f46e5, #8b5cf6);
            color: white;
            display: grid;
            place-items: center;
            font-size: 28px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(79, 70, 229, .28);
        }

        .brand h1 {
            color: #25205d;
            font-size: 28px;
            margin: 0 0 7px;
            font-weight: 800;
            letter-spacing: -.7px;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            margin: 0;
            line-height: 1.5;
        }

        .form-heading {
            color: #25205d;
            font-size: 17px;
            font-weight: 700;
            margin: 0 0 5px;
        }

        .form-description {
            color: #8490a3;
            font-size: 12px;
            margin: 0 0 17px;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 13px;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #39445a;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #e0e5ef;
            border-radius: 11px;
            outline: none;
            font-size: 13px;
            font-family: inherit;
            color: #263247;
            background: #f8faff;
            transition: .2s ease;
        }

        input::placeholder {
            color: #a1aabb;
        }

        input:focus {
            border-color: #6d63e8;
            background: white;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .12);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 65px;
        }

        .show-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #6258d8;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            padding: 5px;
            width: auto;
            margin: 0;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            margin-top: 8px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-weight: 700;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 9px 20px rgba(79, 70, 229, .22);
            transition: .2s ease;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(79, 70, 229, .3);
        }

        .error {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
            padding: 11px 13px;
            border-radius: 9px;
            font-size: 12px;
            margin: 0 0 17px;
        }

        .footer {
            text-align: center;
            color: #7b8798;
            font-size: 12px;
            margin-top: 23px;
        }

        a {
            color: #5146d8;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .secure-note {
            text-align: center;
            color: #9aa3b2;
            font-size: 10px;
            margin-top: 18px;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 22px;
            }

            .field-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>
    <main class="auth-card">

        <div class="brand">
            <div class="brand-icon">✓</div>
            <h1>TaskFlow</h1>
            <p class="subtitle">Plan smarter. Stay organized. Get things done.</p>
        </div>

        <h2 class="form-heading">Create your account</h2>
        <p class="form-description">Enter your details to get started with TaskFlow.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <div class="field-row">
                <div class="field">
                    <label for="first_name">First Name</label>
                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        placeholder="Enter first name"
                        autocomplete="given-name"
                        required
                    >
                </div>

                <div class="field">
                    <label for="last_name">Last Name</label>
                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        placeholder="Enter last name"
                        autocomplete="family-name"
                        required
                    >
                </div>
            </div>

            <div class="field">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    minlength="3"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >Show</button>
                </div>
            </div>

            <button type="submit" class="submit-button">
                Create My Account &rarr;
            </button>
        </form>

        <div class="footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign in</a>
        </div>

        <div class="secure-note">
            Your account details are protected with password hashing.
        </div>

    </main>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const toggleButton = document.querySelector(".show-password");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleButton.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                toggleButton.textContent = "Show";
            }
        }
    </script>
</body>
</html>
